# ctxdemo — "The Backpack" context-window demo. http://127.0.0.1:8200 (Caddy: /demo/)
services:
  ctxdemo:
    build: .
    container_name: ctxdemo
    restart: unless-stopped
    ports: ["127.0.0.1:8200:8200"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      - VLLM_URL=http://host.docker.internal:8100
    volumes:
      - ./data:/srv/data

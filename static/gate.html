<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>See it think</title><meta name="robots" content="noindex">
<style>
  :root { --ground: #0f1216; --panel: #171c22; --line: #262d36; --bone: #e6e1d6; --dim: #6b7480; --amber: #f2a93b; --ice: #7fc8e8; --red: #e0553c; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ground); color: var(--bone); font: 18px/1.45 "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 16px; }
  main { width: 100%; max-width: 30em; text-align: center; }
  h1 { font-size: 2em; margin: 0 0 .2em; letter-spacing: -.01em; }
  h1 span { color: var(--amber); }
  p { color: var(--dim); margin: 0 0 1.6em; }
  form { display: flex; gap: .5em; justify-content: center; flex-wrap: wrap; }
  form.login { flex-direction: column; align-items: center; }
  a { color: var(--ice); }
  #swap { display: inline-block; margin-top: 1.2em; font-size: .85em; }
  #in { display: none; }
  #in a.big { display: inline-block; font-weight: 700; color: var(--ground); background: var(--amber); border-radius: .4em; padding: .6em 1.3em; margin: .3em; text-decoration: none; }
  input { font: 1.1em ui-monospace, Menlo, Consolas, monospace; color: var(--bone); background: var(--panel); border: 1px solid var(--line);
    border-radius: .4em; padding: .6em .9em; width: 17em; max-width: 100%; text-transform: uppercase; text-align: center; outline: none; }
  input.login { text-transform: none; }
  input:focus { border-color: var(--ice); }
  input::placeholder { color: var(--dim); text-transform: none; }
  button { font: inherit; font-weight: 700; color: var(--ground); background: var(--amber); border: 0; border-radius: .4em; padding: .6em 1.3em; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #msg { min-height: 1.5em; margin-top: 1em; color: var(--red); font-size: .9em; }
  footer { margin-top: 3em; color: var(--dim); font-size: .75em; }
</style></head>
<body><main>
  <h1>See it <span>think</span></h1>
  <div id="out">
    <p id="lead">Watch a language model choose its words, one token at a time.<br>Sign in with your lab name and password.</p>
    <form id="f" class="login">
      <input id="name" name="username" class="login" type="text" placeholder="lab name" autofocus autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" aria-label="your lab name">
      <input id="pw" name="password" class="login" type="password" placeholder="password" autocomplete="current-password" aria-label="your lab password">
      <input id="key" name="key" type="text" placeholder="the key" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off" aria-label="the key" style="display:none">
      <button id="go" type="submit">Sign in</button>
    </form>
    <div id="msg" role="alert"></div>
    <a href="#" id="swap">I have a key instead</a>
    <footer>One sign-in opens the wall, typed questions, the model switch and your own shell. A shared key opens the wall only.</footer>
  </div>
  <div id="in">
    <p>Signed in as <b id="who"></b>.</p>
    <a class="big" href="/">The wall</a><a class="big" href="/shell/">My shell</a>
    <p style="margin-top:1.6em"><a href="#" id="signout">Sign out</a></p>
  </div>
</main>
<script>
  // Sign in once (POST /api/gate): a right answer sets a cookie and sends you where you were going. A lab sign-in also opens
  // typed questions, the model switch and that user's own shell; the shared key opens the wall only.
  const q = new URLSearchParams(location.search), $ = id => document.getElementById(id), f = $('f'), go = $('go'), msg = $('msg');
  const next = () => { const n = q.get('next') || ''; return n.startsWith('/') && !n.startsWith('//') && !n.startsWith('/gate') ? n : ''; };   // same site only
  let byKey = false;
  const mode = k => { byKey = k; f.classList.toggle('login', !k); $('name').style.display = $('pw').style.display = k ? 'none' : ''; $('key').style.display = k ? '' : 'none';
    go.textContent = k ? 'Enter' : 'Sign in'; $('swap').textContent = k ? 'I have a lab name and password' : 'I have a key instead';
    $('lead').innerHTML = 'Watch a language model choose its words, one token at a time.<br>' + (k ? 'Enter the key to come in.' : 'Sign in with your lab name and password.'); (k ? $('key') : $('name')).focus(); };
  const hub = user => { $('out').style.display = 'none'; $('in').style.display = 'block'; $('who').textContent = user; };
  async function open(body) {
    go.disabled = true; msg.textContent = '';
    try {
      const r = await fetch('/api/gate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (r.ok) { const n = next(); if (n || body.key) { location.replace(n || '/'); } else { hub(body.name.trim()); } return; }   // came here on purpose: show both doors
      msg.textContent = r.status === 429 ? 'Too many tries. Wait a minute and try again.' : byKey ? 'That key does not open the gate.' : 'That name and password do not match.';
    } catch (e) { msg.textContent = 'Could not reach the server: ' + e.message; }
    go.disabled = false; $('key').value = ''; $('pw').value = ''; (byKey ? $('key') : $('pw')).focus();
  }
  $('swap').onclick = e => { e.preventDefault(); msg.textContent = ''; mode(!byKey); };
  f.addEventListener('submit', e => { e.preventDefault();
    if (byKey) { if ($('key').value.trim()) open({ key: $('key').value }); }
    else if ($('name').value.trim() && $('pw').value) open({ name: $('name').value, password: $('pw').value }); });
  $('signout').onclick = async e => { e.preventDefault(); await fetch('/api/gate/out', { method: 'POST' }).catch(() => {}); location.replace('/gate'); };
  if (q.get('k')) { history.replaceState(null, '', '/gate' + (q.get('next') ? '?next=' + encodeURIComponent(q.get('next')) : '')); mode(true); open({ key: q.get('k') }); }   // a QR or a bookmark: /gate?k=THE-KEY
  else fetch('/api/me').then(r => r.ok ? r.json() : null).then(d => { if (d && d.user) { const n = next(); if (n) location.replace(n); else hub(d.user); } }).catch(() => {});   // already signed in
</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>ctxdemo · the guesses</title>
<link rel="stylesheet" href="peek.css">
<style>html,body{height:100%;margin:0;background:#0f1216;overflow:hidden}
#wall-frames{position:absolute;left:0;right:0;top:0;bottom:0}
body.explain-bar-active #wall-frames{top:var(--explain-bar-h)}   /* only shifts down when explain.js actually mounted the bar */
iframe{position:absolute;border:0;border-radius:6px;outline:1px solid #262d36}</style></head>
<body><script src="lib.js"></script><script src="bus.js"></script><script>
  // The frozen wall: positions in % of the screen.  wall.html?layout={"answer":[2,30,60,45],...}&room=wall&replay=1
  const q = new URLSearchParams(location.search), room = q.get('room') || 'wall';
  // Six boxes: ask + chunks + answer down the left, who-it-speaks-as and what-it-almost-said down the right, the numbers along the bottom.
  const DEFAULT = { driver: [2, 3, 60, 22], chunks: [2, 27, 60, 10], answer: [2, 39, 60, 38], persona: [64, 3, 34, 46], almost: [64, 51, 34, 26], tiles: [2, 79, 96, 18] };
  function build(layout) {
    document.body.innerHTML = '<div id="wall-frames"></div>';
    const host = document.getElementById('wall-frames');
    for (const [name, [x, y, w, h]] of Object.entries(layout)) {
      const f = document.createElement('iframe');
      f.src = `panel.html?show=${encodeURIComponent(name)}&room=${encodeURIComponent(room)}` + (name === 'driver' && q.get('replay') === '1' ? '&replay=1' : '');
      Object.assign(f.style, { left: x + '%', top: y + '%', width: w + '%', height: h + '%' });
      host.appendChild(f);
    }
  }
  try {
    let layout = DEFAULT;
    if (q.get('layout')) {
      const parsed = JSON.parse(q.get('layout'));
      const valid = parsed && typeof parsed === 'object' && Object.keys(parsed).length > 0 && Object.values(parsed).every(v => Array.isArray(v) && v.length === 4 && v.every(Number.isFinite));
      if (!valid) throw new Error('malformed ?layout= value');
      layout = parsed;
    }
    build(layout);
  } catch (e) {
    console.error('bad ?layout=, using the default', e);
    build(DEFAULT);
  }
  if (q.get('bar') !== '0') { const s = document.createElement('script'); s.src = 'explain.js'; document.body.appendChild(s); }
</script></body></html>

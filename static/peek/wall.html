<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>See it think</title>
<link rel="stylesheet" href="peek.css">
<style>html,body{height:100%;margin:0;background:#0f1216;overflow:hidden}
#wall-frames{position:absolute;left:0;right:0;top:0;bottom:0}
body.explain-bar-active #wall-frames{top:var(--explain-bar-h)}   /* only shifts down when explain.js actually mounted the bar */
iframe{position:absolute;border:0;border-radius:6px;outline:1px solid #262d36}
/* laptop: a scrolling stack instead of frozen boxes (peekLib.wallFit picks it under 1900 px; ?fit=stack|frozen forces) */
body.stack{overflow:auto}
body.stack #wall-frames{position:static;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
body.stack.explain-bar-active #wall-frames{padding-top:calc(var(--explain-bar-h) + 8px)}
body.stack iframe{position:static;width:100%;display:block}
body.stack iframe[data-panel=driver]{grid-column:1/-1;height:34vh}
body.stack iframe[data-panel=chunks]{grid-column:1/-1;height:14vh}
body.stack iframe[data-panel=answer]{grid-column:1/-1;height:60vh}
body.stack iframe[data-panel=persona]{height:70vh}
body.stack iframe[data-panel=almost]{height:70vh}
body.stack iframe[data-panel=tiles]{grid-column:1/-1;height:22vh}
body.stack iframe[data-panel=room]{grid-column:1/-1;height:70vh}
body.stack iframe[data-panel=layers]{grid-column:1/-1;height:70vh}
@media (max-width:900px){body.stack #wall-frames{grid-template-columns:1fr} body.stack iframe[data-panel=persona],body.stack iframe[data-panel=almost]{height:55vh}}
#wire-overlay{position:fixed;inset:0;z-index:25;display:none;background:rgba(4,6,8,.78)}
#wire-overlay.open{display:block}
#wire-overlay iframe{left:4%;top:calc(var(--explain-bar-h) + 3vh);width:92%;height:calc(94vh - var(--explain-bar-h));outline-color:#7fc8e8}</style></head>
<body><script src="lib.js"></script><script src="bus.js"></script><script>
  // The frozen wall: positions in % of the screen.  wall.html?layout={"answer":[2,30,60,45],...}&room=wall&replay=1
  const q = new URLSearchParams(location.search), room = q.get('room') || 'wall';
  // Six boxes: ask + chunks + answer down the left, who-it-speaks-as and what-it-almost-said down the right, the numbers along the bottom.
  const DEFAULT = { driver: [2, 3, 60, 27], chunks: [2, 32, 60, 9], answer: [2, 43, 60, 34], persona: [64, 3, 34, 46], almost: [64, 51, 34, 26], tiles: [2, 79, 96, 18] };
  const fit = peekLib.wallFit(window.innerWidth, q.get('fit'));
  function build(layout) {
    document.body.innerHTML = '<div id="wall-frames"></div>';
    document.body.classList.toggle('stack', fit === 'stack');
    const host = document.getElementById('wall-frames');
    for (const [name, [x, y, w, h, scale]] of Object.entries(layout)) {   // optional 5th: type scale for a box too small for its own unit
      const f = document.createElement('iframe');
      f.dataset.panel = name;
      f.src = `panel.html?show=${encodeURIComponent(name)}&room=${encodeURIComponent(room)}` + (name === 'driver' && q.get('replay') === '1' ? '&replay=1' : '') + (scale ? `&scale=${scale}` : '');
      if (fit === 'frozen') Object.assign(f.style, { left: x + '%', top: y + '%', width: w + '%', height: h + '%' });
      host.appendChild(f);
    }
  }
  try {
    let layout = DEFAULT;
    if (q.get('with') === 'room') layout = Object.assign({}, DEFAULT, { almost: [64, 51, 34, 12], room: [64, 64, 34, 33], tiles: [2, 79, 60, 18] });   // presenter: the room feed on the right
    if (q.get('with') === 'layers') layout = Object.assign({}, DEFAULT, { persona: [64, 3, 34, 26], almost: [64, 30, 34, 20, 1.35], layers: [64, 51, 34, 27, 1.3] });   // piece 4: the layers panel on the right
    if (q.get('layout')) {
      const parsed = JSON.parse(q.get('layout'));
      const valid = parsed && typeof parsed === 'object' && Object.keys(parsed).length > 0 && Object.values(parsed).every(v => Array.isArray(v) && v.length === 4 && v.every(Number.isFinite));
      if (!valid) throw new Error('malformed ?layout= value');
      layout = parsed;
    }
    build(layout);
  } catch (e) {
    console.error('bad ?layout=, using the default', e);
    build(DEFAULT);
  }
  // "how do we know?" (persona panel) opens the wire panel over everything; the panel's close button / Esc / a tap on the backdrop closes it.
  peekBus.join(room);
  const wireHost = document.createElement('div'); wireHost.id = 'wire-overlay';
  wireHost.addEventListener('click', () => peekBus.send('wire', { open: false }));
  document.body.appendChild(wireHost);
  peekBus.on('wire', d => {
    if (d && d.open && !wireHost.firstChild) { const f = document.createElement('iframe'); f.src = `panel.html?show=wire&room=${encodeURIComponent(room)}`; wireHost.appendChild(f); }
    wireHost.classList.toggle('open', !!(d && d.open));
  });
  if (q.get('bar') !== '0') { const s = document.createElement('script'); s.src = 'explain.js'; document.body.appendChild(s); }
</script></body></html>

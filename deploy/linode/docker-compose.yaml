# ctxdemo on the NFCU Linode (RTX 4000 Ada, 20 GB): vLLM + ctxdemo + Caddy, one compose, one private network.
# Only Caddy publishes ports (80/443). No camera, no whisper, no vision model — the tab-6 wall on laptops.
#   cd /srv/projects/ctxdemo/deploy/linode && docker compose up -d --build      (update: ../../deploy/linode/update.sh)
services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    restart: unless-stopped
    ipc: host
    volumes:
      - /srv/data/hf:/root/.cache/huggingface      # model cache (Qwen3-8B-FP8 ~8.7 GB, pulled on first start)
    environment:
      - HF_HUB_DISABLE_TELEMETRY=1
      - VLLM_LOGGING_LEVEL=INFO
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # MODEL / MODEL_ARGS come from .env in this directory (written by 03-stack.sh; rewritten by the wall's model switch,
    # which the HOST applies via a systemd path unit — the container never touches docker).
    # No --served-model-name: the served id is the repo id, and ctxdemo learns it from /v1/models.
    command: >
      ${MODEL:-Qwen/Qwen3-8B-FP8}
      --gpu-memory-utilization 0.90
      --kv-cache-dtype fp8
      --max-model-len 32768
      --max-num-seqs 16
      ${MODEL_ARGS:---reasoning-parser qwen3 --enable-auto-tool-choice --tool-call-parser hermes}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 80
      start_period: 300s

  ctxdemo:
    build: { context: ../.., args: { CTXDEMO_TOKENIZER: Qwen/Qwen3-8B } }
    container_name: ctxdemo
    restart: unless-stopped
    environment:
      - VLLM_URL=http://vllm:8000
      - HF_HUB_OFFLINE=1
      - CTXDEMO_TURNLOG=/srv/data/logs/turns.jsonl    # on for the talk (said on the slide; first names optional)
      - CTXDEMO_TURNLOG_KEEP=300                       # …and held 5 minutes only: the file and the room feed forget older turns (Simon, 2026-09-25, for the NFCU ask)
      - CTXDEMO_FREETEXT=password                       # typed questions + custom personas need the model-switch password (Simon, 2026-09-24); prepared questions for everyone
      - CTXDEMO_ROOM=1                                 # optional first-name box -> the room feed
      - CTXDEMO_HOST_BLURB=one rented GPU in Seattle (questions are logged; first names optional)
      - CTXDEMO_INFOGRAPHIC=see-it-think-nfcu.pdf   # the "this wall" card links the NFCU edition of the one-pager (rented GPU, no layers sidecar)
      - CTXDEMO_VOCAB=plain                            # say "tokens" and "context window" on this wall (Gonzaga keeps pieces/backpack)
      - NETDATA_URL=http://host.docker.internal:19999  # GPU busy % tile (Netdata on the host)
      - CTXDEMO_ADMIN_PASSWORD=${CTXDEMO_ADMIN_PASSWORD:-}   # the model switch (from .env; empty = switching off)
      - CTXDEMO_COMPOSE_DIR=/srv/compose                     # where .env lives inside the container
      - CTXDEMO_HF_HUB=/srv/data/hf/hub
      # - CTXDEMO_AUDIENCE=1                           # put back to clamp plain visitors (4k / 600 tokens / no web); /presenter/ keeps the full set
    volumes:
      - /srv/data/logs:/srv/data/logs
      - /srv/projects/ctxdemo/deploy/linode:/srv/compose      # the model switch writes .env here; the host's path unit does the restart
      - /srv/data/hf/hub:/srv/data/hf/hub:ro                # to flag which models are already downloaded
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      vllm: { condition: service_healthy }

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    command: ["caddy", "run", "--config", "/etc/caddy/conf/Caddyfile", "--adapter", "caddyfile"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./:/etc/caddy/conf:ro                          # the DIRECTORY, not the file: git pull replaces the inode and a file mount would keep the old one
      - /srv/data/caddy:/etc/caddy/auth:ro             # htpasswd + htpasswd-presenter
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [ctxdemo]

volumes:
  caddy_data:
  caddy_config:
